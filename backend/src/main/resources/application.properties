# Application
spring.application.name=tournament

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/esport_tournament_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# CORS Configuration (handled by SecurityConfig)
# No additional CORS properties needed here

# JWT Configuration
jwt.secret=esport-tournament-super-secret-key-that-is-at-least-256-bits-long-for-hs256
jwt.expiration=86400000
